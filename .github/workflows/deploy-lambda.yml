# Deploy the Lambda stack. Trigger: push to main (stack paths only), or
# manual dispatch. Safe to merge before AWS is wired in: the test job
# runs without AWS, and the plan job fails at the OIDC auth step until
# the role exists (see deploy/terraform/README.md for the prerequisites).
#
# Flow: plan job (bootstrap ECR -> build+push image -> terraform plan,
# plan saved as an artifact) -> apply job (gated by the `deploy-lambda`
# GitHub environment, required reviewers) -> UI build+upload. Nothing
# applies without a reviewed plan: there is no bare -auto-approve here.
# Project/environment defaults here MUST match the Terraform defaults
# (project=agent-data-platform, environment=dev) because the image name
# is built before apply and Terraform constructs the same ECR URL.
# ECR repo name MUST match the stack's name_prefix (project-environment
# -lambda) plus "-api": see deploy/terraform/stacks/aws-lambda/main.tf.
#
# Action pins are full commit SHAs (tag in the comment), not tags:
# Dependabot/Renovate should keep them fresh.
name: Deploy (AWS Lambda)

on:
  push:
    branches: ["main"]
    paths:
      - "deploy/terraform/stacks/aws-lambda/**"
      - "deploy/terraform/modules/**"
      - "Dockerfile.lambda"
      - "src/ui/**"
      - ".github/workflows/deploy-lambda.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-lambda
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/reusable-build-test.yml

  plan:
    name: Build, push, plan (Lambda stack)
    runs-on: ubuntu-latest
    needs: test
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      PROJECT_NAME: ${{ vars.PROJECT_NAME || 'agent-data-platform' }}
      ENVIRONMENT: ${{ vars.ENVIRONMENT || 'dev' }}
      TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
      TF_VAR_gemini_api_key: ${{ secrets.TF_VAR_gemini_api_key }}
      TF_VAR_data_connections: ${{ secrets.TF_VAR_data_connections }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # m-21: deploy jobs must install Terraform themselves — the
      # reusable workflow does, but these jobs previously invoked
      # `terraform` with no install step, relying on whatever the
      # runner happens to preinstall. Pinned to 1.9.0, the version this
      # repo's Terraform was built against; the plan artifact below is
      # version-sensitive, so the apply job pins the same version.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.0"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"
          aws ecr get-login-password --region "${{ env.AWS_REGION }}" \
            | docker login --username AWS --password-stdin "$REGISTRY"

      # Idempotent bootstrap: the ECR repo must exist BEFORE the push
      # (terraform apply creates it, but runs after the push). Creating
      # an existing repo is a no-op error, swallowed here on purpose;
      # a real failure surfaces at the push step below.
      - name: Bootstrap ECR repository (idempotent)
        run: |
          aws ecr create-repository \
            --repository-name "${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-lambda-api" \
            --region "${{ env.AWS_REGION }}" \
            || echo "ECR repo already exists (or will be created by apply)"

      - name: Build and push Lambda image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-lambda-api:$IMAGE_TAG"
          # The repo is IMMUTABLE, so a re-run for the same commit
          # cannot re-push the same tag — skip the push when it is
          # already there instead of failing the re-run.
          if aws ecr describe-images \
              --repository-name "${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-lambda-api" \
              --image-ids "imageTag=$IMAGE_TAG" \
              --region "${{ env.AWS_REGION }}" >/dev/null 2>&1; then
            echo "Image $IMAGE_TAG already exists (workflow re-run) — skipping build+push."
          else
            # --platform matters: the Lambda function is x86_64, and a
            # plain build on an arm64 host would produce an image that
            # fails on the function (m-27).
            docker build --platform linux/amd64 -f Dockerfile.lambda -t "$IMAGE" .
            docker push "$IMAGE"
          fi

      - name: Terraform plan (Lambda stack)
        working-directory: deploy/terraform/stacks/aws-lambda
        env:
          MODEL_PROVIDER: ${{ vars.MODEL_PROVIDER }}
        run: |
          # An unset TF_VAR_data_connections secret expands to "", which
          # would override the "{}" default with an empty string and
          # break Lambda startup; default it here (same pattern the EKS
          # workflow already used for its Secret).
          export TF_VAR_data_connections="${TF_VAR_data_connections:-{}}"
          MODEL_PROVIDER="${MODEL_PROVIDER:-gemini}"
          # Array, not a bare string: an unquoted $EXTRA_VARS splits on
          # whitespace, and a quoted "$EXTRA_VARS" would pass an empty
          # argument to terraform when the provider is not bedrock.
          EXTRA_VARS=()
          if [ "$MODEL_PROVIDER" = "bedrock" ]; then
            EXTRA_VARS=(-var=enable_bedrock_invoke=true)
          fi
          terraform init -input=false
          terraform plan -input=false -out=tfplan \
            -var="project=${{ env.PROJECT_NAME }}" \
            -var="environment=${{ env.ENVIRONMENT }}" \
            -var="image_tag=${{ github.sha }}" \
            -var="model_provider=$MODEL_PROVIDER" \
            "${EXTRA_VARS[@]}"

      - name: Upload plan artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lambda-tfplan
          path: deploy/terraform/stacks/aws-lambda/tfplan
          retention-days: 7

  apply:
    name: Apply plan + deploy UI (Lambda stack)
    runs-on: ubuntu-latest
    needs: plan
    # Deploy gate: create this environment in the repo (Settings ->
    # Environments) with required reviewers before the first real
    # deploy. GitHub auto-creates a referenced environment with NO
    # protection if it does not exist yet, so referencing it here is
    # safe — but until reviewers are configured, the gate is not real.
    environment: deploy-lambda
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      PROJECT_NAME: ${{ vars.PROJECT_NAME || 'agent-data-platform' }}
      ENVIRONMENT: ${{ vars.ENVIRONMENT || 'dev' }}
      TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
      TF_VAR_gemini_api_key: ${{ secrets.TF_VAR_gemini_api_key }}
      TF_VAR_data_connections: ${{ secrets.TF_VAR_data_connections }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Same pinned Terraform as the plan job (m-21): plan artifacts
      # are version-sensitive, so apply must not use a different one.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.0"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download plan artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lambda-tfplan
          path: deploy/terraform/stacks/aws-lambda

      - name: Terraform apply (Lambda stack, reviewed plan only)
        working-directory: deploy/terraform/stacks/aws-lambda
        run: |
          export TF_VAR_data_connections="${TF_VAR_data_connections:-{}}"
          terraform init -input=false
          terraform apply -input=false tfplan

      - name: Read stack outputs
        id: tf-out
        working-directory: deploy/terraform/stacks/aws-lambda
        run: |
          echo "bucket=$(terraform output -raw ui_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "distribution=$(terraform output -raw ui_distribution_id)" >> "$GITHUB_OUTPUT"
          echo "function_url=$(terraform output -raw function_url)" >> "$GITHUB_OUTPUT"
          echo "ui_url=$(terraform output -raw ui_url)" >> "$GITHUB_OUTPUT"

      # The UI MUST be built AFTER the apply, with VITE_API_URL set to
      # the Function URL: without it the bundle calls relative /api/*
      # against its own CloudFront origin (S3 only), which returns HTML
      # for /api/chat instead of JSON. Trailing slash trimmed so
      # ${BASE}/api/... does not double-slash.
      # NOTE: with the default function_url_auth=AWS_IAM, a browser
      # cannot sign requests to the Function URL — see
      # deploy/terraform/README.md. NONE is dev-only.
      # m-26: the UI build previously ran with whatever Node the
      # runner preinstalls and no npm cache; pin Node 20 (same as the
      # reusable workflow) with the npm cache.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/ui/package-lock.json

      - name: Build and upload UI
        working-directory: src/ui
        env:
          FUNCTION_URL: ${{ steps.tf-out.outputs.function_url }}
        run: |
          FUNCTION_URL="${FUNCTION_URL%/}"
          echo "Building UI with VITE_API_URL=$FUNCTION_URL"
          npm ci
          VITE_API_URL="$FUNCTION_URL" npm run build
          aws s3 sync dist/ "s3://${{ steps.tf-out.outputs.bucket }}" --delete
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.tf-out.outputs.distribution }}" --paths "/*"
          echo "Function URL: ${{ steps.tf-out.outputs.function_url }}"
          echo "UI URL: ${{ steps.tf-out.outputs.ui_url }}"
