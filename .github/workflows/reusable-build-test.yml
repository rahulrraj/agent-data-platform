# Reusable build + test workflow. Used by ci.yml on every push/PR and by
# each per-platform deploy workflow before it deploys. Adding a platform
# means adding one deploy workflow that calls this — never editing this
# file's job structure for a platform.
name: Reusable build and test

on:
  workflow_call:

jobs:
  backend-test:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend + test deps
        # mangum is installed separately (not the lambda extra) because
        # the Lambda handler tests import it, while the runtime-interface
        # client is only a container entrypoint and never imported.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"
          pip install "mangum>=0.22"
      - name: Run backend suite
        run: python -m pytest -q

  ui-test:
    name: UI tests (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/ui/package-lock.json
      - name: Install UI deps
        run: npm ci
      - name: Run UI tests
        run: npm test

  terraform-check:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Check formatting
        run: terraform fmt -check -recursive deploy/terraform
      - name: Validate stacks (no backend, no AWS access)
        run: |
          for stack in deploy/terraform/stacks/*/; do
            echo "== $stack =="
            (cd "$stack" && terraform init -backend=false -input=false >/dev/null && terraform validate)
          done
