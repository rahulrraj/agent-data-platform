# SPA fallback: the React app handles client-side routing.
#
# DEPLOYMENT REQUIREMENT (M-31): this image serves ONLY the static UI —
# it has no /api location. It must always sit behind a front door that
# routes /api/* to the API before / to this UI (the k8s Ingress in
# deploy/k8s/ingress.yaml does this, as does a CloudFront distribution
# with an /api/* behavior pointing at the API origin). Running this
# image standalone with VITE_API_URL unset does NOT work: /api/health
# falls through to index.html (HTTP 200, HTML body), so the UI's
# res.json() throws and it shows a generic "API offline" banner rather
# than a routing error. A template-driven /api proxy (nginx:alpine
# envsubst) was considered and deliberately NOT added: it could not be
# verified in this environment (no docker/nginx available to run the
# image), and an unverified proxy — with envsubst's $uri escaping
# pitfalls — risks breaking the working deployments. If a self-sufficient
# standalone image is ever wanted, add the proxy as a tested change,
# not as an untested config edit.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
