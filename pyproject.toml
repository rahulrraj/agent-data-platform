[project]
name = "agent-data-platform"
version = "0.1.0"
description = "Agent platform: HTTP API + React UI, with a registry connecting the agent to organization data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "strands-agents>=1.50",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "PyJWT[crypto]>=2.8",
    "langchain>=1.0",
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-ollama>=1.0",
    "langchain-google-genai>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
postgres = ["psycopg[binary]>=3.1"]
# Lambda entrypoint (controllers/lambda_handler.py + Dockerfile.lambda):
# Mangum translates Lambda events to the ASGI app; the runtime interface
# client provides `python -m awslambdaric`, the entrypoint for custom base
# images. The RIC could not be verified from the sandbox pip index, so it
# is left unpinned; Mangum 0.22 is what the handler tests run against.
lambda = ["mangum>=0.22", "awslambda-python-runtime-interface-client"]
# Optional per-kind drivers, imported lazily by their adapters:
#   snowflake = ["snowflake-connector-python>=3.0"]
#   sqlserver = ["pyodbc>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
