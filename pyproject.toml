[project]
name = "agent-api"
version = "0.1.0"
description = "Minimal HTTP API that invokes a Strands agent with a few tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "strands-agents>=1.50",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "langchain>=1.0",
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-ollama>=1.0",
    "langchain-google-genai>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Optional per-kind drivers, imported lazily by their adapters:
#   snowflake = ["snowflake-connector-python>=3.0"]
#   sqlserver = ["pyodbc>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
