# Build the image from the repo root first:
#   docker build -f src/ui/Dockerfile -t <registry>/agent-ui:latest .
#   docker push <registry>/agent-ui:latest
# The UI calls the API over the same origin (/api/*), routed by the ingress.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-ui
  namespace: agent-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent-ui
  template:
    metadata:
      labels:
        app: agent-ui
    spec:
      # Matches the nginx-unprivileged image (nginx user, UID 101).
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          image: agent-ui:latest # <-- your registry image
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: agent-ui
  namespace: agent-platform
spec:
  selector:
    app: agent-ui
  ports:
    - port: 80
      # The UI container listens on 8080 (non-root nginx); the Service
      # port stays 80 so the Ingress is unchanged.
      targetPort: 8080
