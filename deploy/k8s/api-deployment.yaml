# Build the image from the repo root first:
#   docker build -t <registry>/agent-data-platform:latest .
#   docker push <registry>/agent-data-platform:latest
# then set spec.template.spec.containers[0].image below.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-api
  namespace: agent-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent-api
  template:
    metadata:
      labels:
        app: agent-api
    spec:
      # IRSA: the API pods run as this ServiceAccount so they assume
      # the Terraform-managed role (Bedrock invoke). See
      # serviceaccount.yaml — the deploy-eks pipeline annotates it
      # with the role ARN. On a cluster without IRSA (kind, standalone
      # dev) the account is just an identity with no AWS role.
      serviceAccountName: agent-api
      # Matches the image's non-root user (Dockerfile creates appuser
      # UID 10001 and chowns /app to it).
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: agent-data-platform:latest # <-- your registry image
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: agent-platform-config
          env:
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: agent-platform-secrets
                  key: POSTGRES_DSN
            - name: DATA_CONNECTIONS
              valueFrom:
                secretKeyRef:
                  name: agent-platform-secrets
                  key: DATA_CONNECTIONS
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-platform-secrets
                  key: GEMINI_API_KEY
            # Bedrock (kind/dev only — EKS uses IRSA instead): short-lived
            # keys from the SSO profile, set in the Secret by Way 3 of
            # doc/run-locally.md. Optional refs: the pods start without
            # them, but Bedrock calls (chat + Titan embeddings) fail
            # until they are present. boto3 reads all three from env.
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: agent-platform-secrets
                  key: AWS_ACCESS_KEY_ID
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-platform-secrets
                  key: AWS_SECRET_ACCESS_KEY
                  optional: true
            - name: AWS_SESSION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agent-platform-secrets
                  key: AWS_SESSION_TOKEN
                  optional: true
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/ready
              port: 8000
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: agent-api
  namespace: agent-platform
spec:
  selector:
    app: agent-api
  ports:
    - port: 80
      targetPort: 8000
