# ServiceAccount for the API pods. The annotation carries the IRSA
# role created by deploy/terraform/stacks/aws-eks (irsa_role_arn
# output): with it, pods assume that role via the cluster OIDC
# provider and get Bedrock invoke rights without a key in env.
#
# The placeholder below MUST be replaced before applying — the
# deploy-eks pipeline substitutes the real role ARN into a temp copy
# (like the ECR image URLs). Applied as-is, the annotation is inert:
# pods run, but Bedrock calls fail with no credentials.
# The trust policy in the Terraform stack pins this exact
# namespace/name (agent-platform/agent-api); rename one, rename both.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-api
  namespace: agent-platform
  annotations:
    eks.amazonaws.com/role-arn: REPLACE-WITH-IRSA-ROLE-ARN
