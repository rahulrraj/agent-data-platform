# Non-secret configuration. Secrets (POSTGRES_DSN, DATA_CONNECTIONS,
# GEMINI_API_KEY) live in secret.yaml — never commit real values.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-platform-config
  namespace: agent-platform
data:
  AGENT_FRAMEWORK: "strands"
  AGENT_MODEL_PROVIDER: "ollama"
  # Region for AWS SDK calls (Bedrock, when the provider is bedrock):
  # the Lambda stack sets AWS_REGION, but these manifests previously
  # relied on the SDK default chain, which has no region in-cluster.
  # The deploy-eks workflow substitutes the real region here; the
  # committed default is only a placeholder for local clusters.
  # NOTE: a region alone grants no Bedrock access — pods still need
  # credentials. The correct pattern is IRSA (OIDC provider +
  # service-account role), which is a known follow-up, NOT built here.
  AWS_REGION: "us-east-1"
  # Point at an in-cluster Ollama, or an external host. The API must reach it.
  OLLAMA_HOST: "http://ollama:11434"
  OLLAMA_MODEL: "qwen2.5:1.5b"
  OLLAMA_EMBED_MODEL: "nomic-embed-text"
  CONVERSATION_STORE: "postgres"
  RETRY_MAX_ATTEMPTS: "3"
  RETRY_BASE_DELAY: "0.5"
  PORT: "8000"
