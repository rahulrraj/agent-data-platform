# Front door for the local container stack (deploy/local/run.sh).
# nginx-unprivileged on port 8080: sends /api/* to the API container and
# everything else to the UI container. This is the local equivalent of
# the k8s Ingress (deploy/k8s/ingress.yaml) — same routing, different
# substrate. The host port (8501 by default) is the address registered
# in Okta as the sign-in redirect URI and Trusted Origin.
#
# Two deliberate choices, both from the 2026-11-06 review:
#
# 1. The access log MUST NOT record query strings. nginx's default
#    `combined` format logs $request, i.e. the full URI including
#    `?code=...&state=...` — the Okta login code would land in the log.
#    The code is single-use and short-lived, but a front door should
#    not log it. This format logs $uri (path only) instead.
# 2. /api/chat streams, so proxy buffering is off and the read timeout
#    is long (15 min, matching the Function URL allowance for long
#    agent turns). A short timeout would cut long turns off mid-stream.
#
# Upstream names (agent-api, agent-ui) resolve via Docker DNS on the
# shared network created by run.sh; they are not reachable from the host.

log_format noquery '$remote_addr - $remote_user [$time_local] '
                   '"$request_method $uri $server_protocol" $status '
                   '$body_bytes_sent "$http_referer" "$http_user_agent"';

access_log /var/log/nginx/access.log noquery;

server {
    listen 8080;

    location /api/ {
        proxy_pass http://agent-api:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Authorization passes through untouched (it is a normal
        # request header): the API checks the bearer token itself.
    }

    location / {
        proxy_pass http://agent-ui:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
