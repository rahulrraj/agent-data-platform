# kind cluster for the local Kubernetes path (see doc/run-locally.md).
# Maps host ports 80/443 to the ingress controller so the Ingress host
# agent-platform.example.com is reachable from the browser. Binding
# ports below 1024 needs privileges: on Linux run kind as root (or a
# user with the capability); on macOS/Windows Docker Desktop it works
# as-is. If 80/443 are taken, change hostPort here and use the matching
# port in the URL — but the Okta redirect URI must then include it.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
